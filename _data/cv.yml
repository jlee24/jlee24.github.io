          - Collaborating with United Nations World Food Programme and GiveDirectly.
      - company: Google, Geo Insights Team
        position: Software Engineering Intern
        location: Mountain View, CA
        start_date: 2019-06
        end_date: 2019-09
        summary: Designed and built pipeline to perform weakly supervised segmentation on aerial imagery, including training model and evaluating predictions. Developed novel method that soft-labels masks by synthesizing data augmentations.
        highlights:
          - TensorFlow, Apache Beam, OpenCV, Python imaging libraries, machine learning at scale
      - company: Stanford Sustain Lab
        position: Researcher
        location: Stanford, CA
        start_date: 2018
        end_date: 2019
        summary: Developed a weakly supervised geovisual search pipeline that learns how to perform detection from classification labels and uses data augmentation + human-in-the-loop data distillation. Applied to locate brick kilns in Bangladesh to monitor environmental regulations.
        highlights:
          - Advised by Stefano Ermon, David Lobell, Marshall Burke, Steve Luby | Mentored by Nina Brooks
          - Received Firestone Medal (only 1 in CS Department)
      - company: Pinterest, Visual Search Team
        position: Software Engineering Intern
        location: San Francisco, CA
        start_date: 2018-06
        end_date: 2018-09
        summary: Implemented data distillation to automatically augment training datasets from billions of unlabeled, user-generated imagery at little to no cost. Expanded dataset size by 200% and showed newly trained model performs better.
        highlights:
          - Kleiner-Perkins Engineering Fellow
          - TensorFlow, Hadoop/SQL, Pandas, Python imaging libraries
      - company: Stanford Vision & Learning Lab
        position: Researcher
        location: Stanford, CA
        start_date: 2017
        end_date: 2019
        summary: Investigated an active learning system that generates questions about images on social media and asks them to users to automatically collect data. Created a sequential attention-based model to handle noisy responses.
        highlights:
          - Advised by Fei-Fei Li, Michael Bernstein | Mentored by Ranjay Krishna
          - Gave spotlight talk at CS 231N (Spring 2017)
          - Presented at Stanford Human-Centered AI Symposium (Spring 2019)
      - company: Matterport
        position: Computer Vision Software Intern
        location: Sunnyvale, CA
        start_date: 2017-06
        end_date: 2017-09
        summary: Developed algorithm that creates 3D point cloud models from real-time scanning that is robust to color balance and lighting changes within a single scene.
        highlights:
          - C++, OpenGL, OpenCV, Android
      - company: Stanford HCI Lab
        position: Researcher
        location: Stanford, CA
        start_date: 2016
        end_date: 2017
        summary: Developed a system that uncovers insights for creative experts (journalists, podcasters) from large amounts of unstructured visual and language data. Created an interactive archive for Douglas Engelbart's work.
        highlights:
          - Advised by Maneesh Agrawala | Mentored by Mitchell Gordon, Juho Kim
          - Publication: UIST '17 (30th Annual ACM Symposium on User Interface Software and Technology)
